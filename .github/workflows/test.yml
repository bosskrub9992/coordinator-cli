name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: git config --global user.name ci && git config --global user.email ci@example.com
        shell: bash
      - run: go install github.com/kunchenguid/treehouse@latest
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./cmd/... ./internal/...
      - if: runner.os == 'Windows'
        run: go test ./cmd/... ./internal/...
